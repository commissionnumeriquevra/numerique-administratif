# Déploiement automatique sur Firebase Hosting à chaque push sur main.
# 1. Remplacez VOTRE_PROJET_FIREBASE par l'identifiant du projet (ex : numerique-administratif)
# 2. Ajoutez le secret FIREBASE_SERVICE_ACCOUNT dans GitHub (Settings > Secrets > Actions)
name: Déployer sur Firebase Hosting
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: VOTRE_PROJET_FIREBASE
